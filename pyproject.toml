[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pdnlab-dc"
version = "0.0.1"
description = "Open-source DC power-integrity (IR drop) solver for PCBs"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = [
    "meshio>=5.3.5",
    "numpy>=1.26",
    "scipy>=1.11",
    "shapely>=2.2.0",
]

[project.scripts]
pdnlab-dc = "pdnlab_dc.cli:main"

[dependency-groups]
dev = [
    "matplotlib>=3.11.2",
    "pytest>=8",
]

[tool.hatch.build.targets.wheel]
packages = ["src/pdnlab_dc"]

[tool.pytest.ini_options]
testpaths = ["tests"]
